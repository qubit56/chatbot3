<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 AI 학습 챗봇</title><style>body{font-family:system-ui;background:#eef3fb;margin:0;color:#18263d}.wrap{max-width:760px;margin:30px auto;background:white;border-radius:18px;box-shadow:0 8px 30px #b9c8df;padding:24px}h1{margin-top:0}#chat{height:55vh;overflow:auto;border:1px solid #dae2ee;border-radius:12px;padding:15px}.msg{padding:12px;border-radius:12px;margin:9px 0;white-space:pre-wrap}.user{background:#dceaff;margin-left:15%}.bot{background:#edf5ee;margin-right:15%}.controls{display:flex;gap:8px;margin-top:12px}input,button{padding:12px;border-radius:9px;border:1px solid #ccd5e2;font:inherit}#question{flex:1;min-width:0}button{background:#2563eb;color:white;cursor:pointer}small{color:#66758c}</style></head><body><main class="wrap"><h1>🎓 우리 반 AI 학습 챗봇</h1><p>궁금한 내용을 질문해 보세요. AI가 단계별로 설명합니다.</p><label>닉네임 <input id="nickname" maxlength="30" placeholder="예: 학생01"></label><div id="chat" aria-live="polite"><div class="msg bot">안녕하세요! 오늘 무엇을 배우고 싶으신가요?</div></div><form id="form" class="controls"><input id="question" maxlength="2000" placeholder="질문을 입력하세요" required><button id="send">질문하기</button></form><p><small>개인정보, 비밀번호, 민감한 정보를 입력하지 마세요. AI 답변은 틀릴 수 있습니다.</small></p></main><script>const chat=document.querySelector('#chat'),form=document.querySelector('#form'),q=document.querySelector('#question'),send=document.querySelector('#send');let history=[];function add(role,text){let el=document.createElement('div');el.className='msg '+(role==='user'?'user':'bot');el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight;return el}form.addEventListener('submit',async e=>{e.preventDefault();let question=q.value.trim(),nickname=document.querySelector('#nickname').value.trim()||'익명';if(!question)return;add('user',question);q.value='';send.disabled=true;let pending=add('assistant','답변을 생성하고 있습니다...');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,nickname,history:history.slice(-8)})});let data=await r.json();if(!r.ok)throw Error(data.error||'요청 실패');pending.textContent=data.answer;history.push({role:'user',content:question},{role:'assistant',content:data.answer})}catch(err){pending.textContent='오류: '+err.message}finally{send.disabled=false;q.focus()}})</script></body></html>
