<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 AI 학습 챗봇</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#13233f;background:#f4f7fb}*{box-sizing:border-box}main{max-width:800px;margin:30px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 5px 25px #18345312}h1{font-size:28px}label{display:block;margin:16px 0 7px;font-weight:600}input,textarea{font:inherit;border:1px solid #b9c8da;border-radius:10px;padding:12px;width:100%}textarea{min-height:90px;resize:vertical}.chat{border:1px solid #d8e3ef;border-radius:14px;padding:15px;height:420px;overflow-y:auto;background:#fbfdff}.msg{padding:13px 15px;border-radius:13px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.ai{background:#eaf4ed;margin-right:12%}.user{background:#dce9ff;margin-left:12%}.error{background:#fff0ec;color:#9b2929}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}button{font:inherit;background:#2563eb;color:white;border:0;padding:13px 20px;border-radius:10px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.muted{font-size:13px;color:#607086}.status{font-size:13px;color:#3f647a}@media(max-width:600px){main{margin:0;padding:14px;border-radius:0}.chat{height:50vh}}
</style></head><body><main><h1>🎓 우리 반 AI 학습 챗봇</h1><p>질문하면 AI가 단계별로 설명합니다.</p><label for="nickname">닉네임</label><input id="nickname" maxlength="30" value="학생1"><div class="row"><p class="status" id="status">서버 연결 확인 중...</p><span class="muted">버전: fixed-v2</span></div><section id="chat" class="chat" aria-live="polite"><div class="msg ai">안녕하세요! 오늘 무엇을 배우고 싶으신가요?</div></section><form id="form"><label for="message">질문</label><textarea id="message" maxlength="2000" required placeholder="예: QAOA에서 p=2는 무엇인가요?"></textarea><div class="row"><small class="muted">개인정보를 입력하지 마세요.</small><button id="send" type="submit">질문하기</button></div></form></main><script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#message'),send=document.querySelector('#send'),statusEl=document.querySelector('#status');
function bubble(text,cls){const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el;}
async function parseResponse(response){const raw=await response.text();let data;try{data=JSON.parse(raw);}catch{throw Error('서버가 JSON이 아닌 응답을 반환했습니다. HTTP '+response.status+' / '+raw.slice(0,160));}if(!response.ok)throw Error((data.error||'서버 오류')+(data.receivedKeys?' (받은 필드: '+data.receivedKeys.join(', ')+')':''));return data;}
async function check(){try{const r=await fetch('/api/health',{cache:'no-store'});const d=await parseResponse(r);statusEl.textContent='API 연결 '+(d.aiBound?'정상':'AI 바인딩 없음')+' · D1 '+(d.dbBound?'연결됨':'미연결')+' · '+d.version;}catch(e){statusEl.textContent='API 연결 확인 실패: '+e.message;}}
form.addEventListener('submit',async event=>{event.preventDefault();const question=input.value.trim();if(!question){bubble('질문을 입력해 주세요.','error');return;}const nickname=document.querySelector('#nickname').value.trim()||'학생';bubble(nickname+': '+question,'user');input.value='';send.disabled=true;const pending=bubble('AI가 답변을 작성하고 있습니다...','ai');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:question,nickname})});const data=await parseResponse(r);pending.textContent=data.reply+(data.saved?'\n\n(질문이 저장되었습니다.)':'');}catch(e){pending.className='msg error';pending.textContent='오류: '+e.message;}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight;}});check();
</script></body></html>
